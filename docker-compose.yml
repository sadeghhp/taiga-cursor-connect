services:
  taiga-mcp:
    build: .
    image: taiga-mcp:local
    stdin_open: true
    tty: false
    environment:
      TAIGA_API_URL: ${TAIGA_API_URL:-http://host.docker.internal:9000/api/v1}
      # Set TAIGA_USERNAME + TAIGA_PASSWORD, or TAIGA_TOKEN (+ optional TAIGA_REFRESH_TOKEN)
      TAIGA_USERNAME: ${TAIGA_USERNAME:-}
      TAIGA_PASSWORD: ${TAIGA_PASSWORD:-}
      TAIGA_TOKEN: ${TAIGA_TOKEN:-}
      TAIGA_REFRESH_TOKEN: ${TAIGA_REFRESH_TOKEN:-}
      # TAIGA_MCP_LOG: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
